<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Signal Graph</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
  <script src="graph-generator.js"></script>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; }
    canvas { display: block; }

    #panel {
      position: fixed;
      top: 8px;
      right: 8px;
      z-index: 9999;
      background: rgba(255,255,255,0.92);
      border: 1px solid #ddd;
      padding: 8px;
      width: 320px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      font-size: 12px;
      user-select: none;
    }
    #panel .row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
    #panel button { padding: 4px 8px; }
    #panel label { display: inline-flex; gap: 6px; align-items: center; }
    #panel select { max-width: 140px; }
    #panel input[type="number"] { width: 90px; }
    #panel input.short { width: 64px; }
    #panel .muted { color: #666; }
    #panel .sectionTitle { font-weight: 600; margin: 8px 0 6px; }
    #panel .hr { height: 1px; background: #e6e6e6; margin: 8px 0; }
    #panel .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
  </style>
</head>
<body>

<div id="panel">
  <div class="row">
    <button id="btnSave" type="button">Save</button>
    <button id="btnLoad" type="button">Load</button>
    <button id="btnReset" type="button">Reset</button>
    <button id="btnClear" type="button">Clear signals</button>
  </div>

  <div class="hr"></div>

  <div class="sectionTitle">Node settings</div>
  <div class="row">
    <label>threshold
      <input id="inpThreshold" type="number" step="1" value="1" />
    </label>
  </div>
  <div class="row">
    <label>frequency
      <input id="inpFreq" type="number" step="1" min="0" value="0" />
    </label>
    <span class="muted">(Hz, 0 = mute)</span>
  </div>

  <div class="row">
    <span class="muted">Hover:</span>
    <span id="hoverInfo" class="mono muted">none</span>
  </div>

  <div class="hr"></div>

  <div class="sectionTitle">Generator</div>
  <div class="row">
    <label>mode
      <select id="genMode">
        <option value="random">random</option>
      </select>
    </label>
  </div>
  <div class="row">
    <label>nodes
      <input id="genNodes" class="short" type="number" step="1" min="1" value="222" />
    </label>
    <label>blue %
      <input id="genBluePercent" class="short" type="number" step="1" min="0" max="100" value="40" />
    </label>
  </div>
  <div class="row">
    <label>edges
      <input id="genEdgesMin" class="short" type="number" step="1" min="0" value="1" />
      <span class="muted">-</span>
      <input id="genEdgesMax" class="short" type="number" step="1" min="0" value="3" />
    </label>
    <label>extra
      <input id="genExtraEdges" class="short" type="number" step="1" min="0" value="200" />
    </label>
  </div>
  <div class="row">
    <label>mute
      <input id="genMuteProb" class="short" type="number" step="0.05" min="0" max="1" value="0.5" />
    </label>
  </div>
  <div class="row">
    <label>freq Hz
      <input id="genFreqMin" class="short" type="number" step="1" min="0" value="80" />
      <span class="muted">-</span>
      <input id="genFreqMax" class="short" type="number" step="1" min="0" value="1200" />
    </label>
  </div>
  <div class="row">
    <label>threshold
      <input id="genThresholdMin" class="short" type="number" step="1" min="1" value="1" />
      <span class="muted">-</span>
      <input id="genThresholdMax" class="short" type="number" step="1" min="1" value="1" />
    </label>
  </div>
  <div class="row">
    <label>w
      <input id="genCanvasW" class="short" type="number" step="100" min="100" value="1000" />
    </label>
    <label>h
      <input id="genCanvasH" class="short" type="number" step="100" min="100" value="1000" />
    </label>
    <button id="btnGenerate" type="button">Generate</button>
  </div>
  <div class="row">
    <span id="genInfo" class="mono muted">ready</span>
  </div>

  <div class="hr"></div>

  <div class="sectionTitle">Controls</div>
  <div class="muted" style="line-height: 1.35;">
    • <b>Click empty</b>: place node with settings above<br/>
    • <b>Click node</b>: activate + drag<br/>
    • <b>Shift + click node</b>, then release on another node: create/increase edge<br/>
    • <b>Hover node + Delete</b>: delete node<br/>
    • <b>Clear signals</b>: reset activity everywhere
  </div>
</div>

<script>
/* ---------- constants ---------- */
const NODE_RADIUS = 10;
const ACTIVATION_DURATION = 500; // ms
const ENGINE_TICK_MS = 300;

// colors (HSB): saturation constant, brightness changes
const SAT = 85;

// made inactive brighter
const BRIGHT_INACTIVE = 45;
const BRIGHT_ACTIVE = 85;

// sign hues
const HUE_POS = 0;    // red
const HUE_NEG = 220;  // blue

function downloadText(filename, text) {
  const blob = new Blob([text], { type: "application/json;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function clampNumber(v, def = 0) {
  const n = Number(v);
  return Number.isFinite(n) ? n : def;
}

function isEditingInput() {
  const el = document.activeElement;
  return el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "SELECT");
}

/* ---------- model ---------- */
class Node {
  constructor(id, x, y, { polarity = 1, frequency = 0, threshold = 1 } = {}) {
    this.id = id;
    this.x = x;
    this.y = y;
    this.polarity = polarity >= 0 ? 1 : -1;
    this.frequency = Math.max(0, frequency);
    this.threshold = threshold;   // numeric
    this.activeUntil = 0;         // millis timestamp
  }

  isActive(now) {
    return now < this.activeUntil;
  }

  activate(now, { force = false } = {}) {
    if (!force && this.isActive(now)) return false;
    this.activeUntil = now + ACTIVATION_DURATION;
    return true;
  }

  contains(mx, my) {
    return dist(mx, my, this.x, this.y) <= NODE_RADIUS;
  }
}

class Edge {
  constructor(id, fromId, toId) {
    this.id = id;
    this.fromId = fromId;
    this.toId = toId;
  }
}

/* ---------- graph ---------- */
class Graph {
  constructor() {
    this.nodes = new Map();
    this.edges = new Map();
    this.nodeOrder = [];
    this.edgeOrder = [];

    this.forwardEdges = new Map();
    this.inEdges  = new Map();
    this.edgeByPair = new Map();

    this.nextNodeId = 1;
    this.nextEdgeId = 1;

    this.selectedFromNodeId = null;
    this.draggingNodeId = null;
    this.hoveredNodeId = null;

    this.tickCount = 0;
    this.engineTimerId = null;
    this.activeNodeIds = new Set();
    this.externalStimulusNodeIds = new Set();

    this.audioCtx = null;
    this.canvas = null;
    this.fileInput = null;
  }

  setup() {
    this.canvas = createCanvas(windowWidth, windowHeight);
    this.canvas.elt.addEventListener("contextmenu", e => e.preventDefault());

    colorMode(HSB, 360, 100, 100, 1);

    this.fileInput = document.createElement("input");
    this.fileInput.type = "file";
    this.fileInput.accept = "application/json";
    this.fileInput.style.display = "none";
    document.body.appendChild(this.fileInput);

    this.fileInput.addEventListener("change", async () => {
      const file = this.fileInput.files && this.fileInput.files[0];
      this.fileInput.value = "";
      if (!file) return;
      try {
        const text = await file.text();
        const data = JSON.parse(text);
        this.deserialize(data);
      } catch (e) {
        alert("Failed to load JSON: " + (e && e.message ? e.message : String(e)));
      }
    });

    this.startEngine();
  }

  startEngine() {
    if (this.engineTimerId !== null) return;
    this.engineTimerId = setInterval(() => this.stepEngine(), ENGINE_TICK_MS);
  }

  resize() {
    resizeCanvas(windowWidth, windowHeight);
  }

  ensureAudio() {
    if (this.audioCtx) return;
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      this.audioCtx = new Ctx();
      if (this.audioCtx.state === "suspended") this.audioCtx.resume();
    } catch (_) {
      this.audioCtx = null;
    }
  }

  playTone(freqHz) {
    if (!this.audioCtx || !freqHz || freqHz <= 0) return;

    const ctx = this.audioCtx;
    const t0 = ctx.currentTime;
    const dur = ACTIVATION_DURATION / 1000;

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(freqHz, t0);

    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.2, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }

  clearSignals() {
    this.activeNodeIds.clear();
    this.externalStimulusNodeIds.clear();
    for (const id of this.nodeOrder) {
      const n = this.nodes.get(id);
      if (n) n.activeUntil = 0;
    }
  }

  clearAll() {
    this.nodes.clear();
    this.edges.clear();
    this.nodeOrder = [];
    this.edgeOrder = [];
    this.forwardEdges.clear();
    this.inEdges.clear();
    this.edgeByPair.clear();
    this.nextNodeId = 1;
    this.nextEdgeId = 1;
    this.tickCount = 0;
    this.activeNodeIds.clear();
    this.externalStimulusNodeIds.clear();
    this.selectedFromNodeId = null;
    this.draggingNodeId = null;
    this.hoveredNodeId = null;
  }

  saveToFile() {
    const payload = JSON.stringify(this.serialize(), null, 2);
    const ts = new Date().toISOString().replace(/[:.]/g, "-");
    downloadText(`graph-${ts}.json`, payload);
  }

  requestLoadFromFile() {
    if (this.fileInput) this.fileInput.click();
  }

  serialize() {
    return {
      version: 1,
      nodes: this.nodeOrder
        .map(id => this.nodes.get(id))
        .filter(Boolean)
        .map(n => ({
          id: n.id,
          x: n.x, y: n.y,
          polarity: n.polarity,
          frequency: n.frequency,
          threshold: n.threshold
        })),
      edges: this.edgeOrder
        .map(id => this.edges.get(id))
        .filter(Boolean)
        .map(e => ({
          id: e.id,
          fromId: e.fromId,
          toId: e.toId
        }))
    };
  }

  deserialize(data) {
    this.clearAll();

    let maxNodeId = 0;
    let maxEdgeId = 0;

    const nodesArr = Array.isArray(data && data.nodes) ? data.nodes : [];
    for (const nd of nodesArr) {
      const id = Math.max(1, Math.floor(clampNumber(nd.id, 0)));
      const x = clampNumber(nd.x, 0);
      const y = clampNumber(nd.y, 0);

      const legacyOutput = clampNumber(nd.output, 1);
      const polarity = nd.polarity === undefined ? legacyOutput : clampNumber(nd.polarity, 1);
      const n = new Node(id, x, y, {
        polarity,
        frequency: Math.max(0, clampNumber(nd.frequency, 0)),
        threshold: Math.trunc(clampNumber(nd.threshold, 1))
      });

      this.nodes.set(id, n);
      this.nodeOrder.push(id);
      this.forwardEdges.set(id, new Set());
      this.inEdges.set(id, new Set());

      if (id > maxNodeId) maxNodeId = id;
    }

    const edgesArr = Array.isArray(data && data.edges) ? data.edges : [];
    for (const ed of edgesArr) {
      const id = Math.max(1, Math.floor(clampNumber(ed.id, 0)));
      const fromId = Math.max(1, Math.floor(clampNumber(ed.fromId, 0)));
      const toId = Math.max(1, Math.floor(clampNumber(ed.toId, 0)));

      if (!this.nodes.has(fromId) || !this.nodes.has(toId) || fromId === toId) continue;

      const key = `${fromId}->${toId}`;
      if (this.edgeByPair.has(key)) {
        continue;
      }

      const e = new Edge(id, fromId, toId);
      this.edges.set(id, e);
      this.edgeOrder.push(id);
      this.edgeByPair.set(key, id);

      this.forwardEdges.get(fromId).add(id);
      this.inEdges.get(toId).add(id);

      if (id > maxEdgeId) maxEdgeId = id;
    }

    this.nextNodeId = maxNodeId + 1;
    this.nextEdgeId = maxEdgeId + 1;
  }

  getNodeAt(mx, my) {
    for (let i = this.nodeOrder.length - 1; i >= 0; i--) {
      const id = this.nodeOrder[i];
      const n = this.nodes.get(id);
      if (n && n.contains(mx, my)) return n;
    }
    return null;
  }

  deleteNode(nodeId) {
    if (!this.nodes.has(nodeId)) return;

    const forward = this.forwardEdges.get(nodeId) || new Set();
    const inn = this.inEdges.get(nodeId) || new Set();
    const toRemove = new Set([...forward, ...inn]);
    for (const edgeId of toRemove) this.deleteEdge(edgeId);

    this.nodes.delete(nodeId);
    this.nodeOrder = this.nodeOrder.filter(id => id !== nodeId);
    this.forwardEdges.delete(nodeId);
    this.inEdges.delete(nodeId);
    this.activeNodeIds.delete(nodeId);
    this.externalStimulusNodeIds.delete(nodeId);

    if (this.selectedFromNodeId === nodeId) this.selectedFromNodeId = null;
    if (this.draggingNodeId === nodeId) this.draggingNodeId = null;
    if (this.hoveredNodeId === nodeId) this.hoveredNodeId = null;
  }

  deleteEdge(edgeId) {
    const e = this.edges.get(edgeId);
    if (!e) return;

    const forward = this.forwardEdges.get(e.fromId);
    if (forward) forward.delete(edgeId);
    const inn = this.inEdges.get(e.toId);
    if (inn) inn.delete(edgeId);

    this.edgeByPair.delete(`${e.fromId}->${e.toId}`);

    this.edges.delete(edgeId);
    this.edgeOrder = this.edgeOrder.filter(id => id !== edgeId);
  }

  addNode(x, y, cfg) {
    const id = this.nextNodeId++;
    const n = new Node(id, x, y, cfg);

    this.nodes.set(id, n);
    this.nodeOrder.push(id);
    this.forwardEdges.set(id, new Set());
    this.inEdges.set(id, new Set());
    return n;
  }

  addOrIncreaseEdge(fromId, toId) {
    if (fromId === toId) return;
    if (!this.nodes.has(fromId) || !this.nodes.has(toId)) return;

    const key = `${fromId}->${toId}`;
    const existingId = this.edgeByPair.get(key);
    if (existingId) {
      return;
    }

    const id = this.nextEdgeId++;
    const e = new Edge(id, fromId, toId, 1);
    this.edges.set(id, e);
    this.edgeOrder.push(id);
    this.edgeByPair.set(key, id);

    this.forwardEdges.get(fromId).add(id);
    this.inEdges.get(toId).add(id);
  }

  requestActivation(nodeId) {
    if (!this.nodes.has(nodeId)) return;
    this.externalStimulusNodeIds.add(nodeId);
  }

  stepEngine() {
    const now = millis();
    const inputByNodeId = new Map();

    for (const fromId of this.activeNodeIds) {
      const src = this.nodes.get(fromId);
      if (!src) continue;

      const forward = this.forwardEdges.get(fromId);
      if (!forward) continue;

      for (const edgeId of forward) {
        const e = this.edges.get(edgeId);
        if (!e || !this.nodes.has(e.toId)) continue;
        const prev = inputByNodeId.get(e.toId) || 0;
        inputByNodeId.set(e.toId, prev + src.polarity);
      }
    }

    const nextActiveNodeIds = new Set();
    for (const nodeId of this.externalStimulusNodeIds) {
      if (this.nodes.has(nodeId)) nextActiveNodeIds.add(nodeId);
    }

    for (const [nodeId, input] of inputByNodeId) {
      const n = this.nodes.get(nodeId);
      if (n && input >= n.threshold) nextActiveNodeIds.add(nodeId);
    }

    this.externalStimulusNodeIds.clear();
    this.activeNodeIds = nextActiveNodeIds;
    this.tickCount += 1;

    for (const nodeId of this.activeNodeIds) {
      const n = this.nodes.get(nodeId);
      if (!n) continue;
      n.activate(now, { force: true });
      this.playTone(n.frequency);
    }
  }

  // color helpers
  hueForPolarity(polarity) {
    return polarity >= 0 ? HUE_POS : HUE_NEG;
  }

  nodeFill(node, now) {
    const active = node.isActive(now);
    const b = active ? BRIGHT_ACTIVE : BRIGHT_INACTIVE;

    const h = this.hueForPolarity(node.polarity);
    return color(h, SAT, b);
  }

  nodeStroke(node, now) {
    const active = node.isActive(now);
    const b = active ? Math.max(10, BRIGHT_ACTIVE - 15) : Math.max(10, BRIGHT_INACTIVE - 10);

    const h = this.hueForPolarity(node.polarity);
    return color(h, SAT, b);
  }

  edgeColorFromSource(srcNode, now) {
    const b = this.activeNodeIds.has(srcNode.id) ? BRIGHT_ACTIVE : BRIGHT_INACTIVE;

    const h = this.hueForPolarity(srcNode.polarity);
    return color(h, SAT, b);
  }

  // threshold -> border thickness (restored)
  nodeBorderWidth(node) {
    const t = Math.abs(Number(node.threshold)) || 0;
    return constrain(1 + t * 2, 1, 24);
  }

  updateHover(mx, my) {
    if (mx < 0 || mx > width || my < 0 || my > height) {
      this.hoveredNodeId = null;
      return;
    }
    const n = this.getNodeAt(mx, my);
    this.hoveredNodeId = n ? n.id : null;
  }

  draw() {
    const now = millis();
    this.updateHover(mouseX, mouseY);

    background(0, 0, 95);

    // edges
    for (const edgeId of this.edgeOrder) {
      const e = this.edges.get(edgeId);
      if (!e) continue;
      const fromNode = this.nodes.get(e.fromId);
      const toNode = this.nodes.get(e.toId);
      if (!fromNode || !toNode) continue;

      const c = this.edgeColorFromSource(fromNode, now);
      stroke(c);
      strokeWeight(3); // thicker arrows

      line(fromNode.x, fromNode.y, toNode.x, toNode.y);

      const dx = toNode.x - fromNode.x;
      const dy = toNode.y - fromNode.y;
      const a = atan2(dy, dx);

      push();
      translate(toNode.x, toNode.y);
      rotate(a);
      stroke(c);
      strokeWeight(3);
      line(0, 0, -14, -7);
      line(0, 0, -14,  7);
      pop();
    }

    // nodes
    for (const nodeId of this.nodeOrder) {
      const n = this.nodes.get(nodeId);
      if (!n) continue;

      fill(this.nodeFill(n, now));
      stroke(this.nodeStroke(n, now));
      strokeWeight(this.nodeBorderWidth(n));
      circle(n.x, n.y, NODE_RADIUS * 2);

      if (this.hoveredNodeId === n.id) {
        noFill();
        stroke(0, 0, 20);
        strokeWeight(2);
        circle(n.x, n.y, NODE_RADIUS * 2 + 10);
      }
    }

    if (this.selectedFromNodeId) {
      const n = this.nodes.get(this.selectedFromNodeId);
      if (n) {
        noFill();
        stroke(0, 0, 20);
        strokeWeight(2);
        circle(n.x, n.y, NODE_RADIUS * 2 + 16);
      }
    }
  }

  mousePressed(mx, my) {
    if (mx < 0 || mx > width || my < 0 || my > height) return;

    this.ensureAudio();

    const isLeft = (mouseButton === LEFT);
    if (!isLeft) return;

    const isShift = keyIsDown(SHIFT);
    const n = this.getNodeAt(mx, my);

    if (n) {
      if (isShift) {
        this.selectedFromNodeId = n.id;
        this.draggingNodeId = null;
        return;
      }
      this.draggingNodeId = n.id;
      this.requestActivation(n.id);
      return;
    }

    const cfg = readPanelConfig();
    this.addNode(mx, my, cfg);
  }

  mouseDragged(mx, my) {
    const id = this.draggingNodeId;
    if (!id) return;

    const n = this.nodes.get(id);
    if (!n) return;

    n.x = constrain(mx, 0, width);
    n.y = constrain(my, 0, height);
  }

  mouseReleased(mx, my) {
    if (this.selectedFromNodeId) {
      const target = this.getNodeAt(mx, my);
      if (target && target.id !== this.selectedFromNodeId) {
        this.addOrIncreaseEdge(this.selectedFromNodeId, target.id);
      }
      this.selectedFromNodeId = null;
    }
    this.draggingNodeId = null;
  }
}

/* ---------- UI binding ---------- */
const inpThreshold = document.getElementById("inpThreshold");
const inpFreq = document.getElementById("inpFreq");
const hoverInfo = document.getElementById("hoverInfo");
const genInfo = document.getElementById("genInfo");

function readPanelConfig() {
  return {
    threshold: Math.trunc(clampNumber(inpThreshold.value, 1)),
    frequency: Math.max(0, clampNumber(inpFreq.value, 0))
  };
}

function readGeneratorConfig() {
  return {
    mode: document.getElementById("genMode").value,
    seed: "",
    nodeCount: document.getElementById("genNodes").value,
    canvasWidth: document.getElementById("genCanvasW").value,
    canvasHeight: document.getElementById("genCanvasH").value,
    bluePercent: document.getElementById("genBluePercent").value,
    edgesMin: document.getElementById("genEdgesMin").value,
    edgesMax: document.getElementById("genEdgesMax").value,
    extraEdges: document.getElementById("genExtraEdges").value,
    thresholdMin: document.getElementById("genThresholdMin").value,
    thresholdMax: document.getElementById("genThresholdMax").value,
    freqMin: document.getElementById("genFreqMin").value,
    freqMax: document.getElementById("genFreqMax").value,
    muteProb: document.getElementById("genMuteProb").value
  };
}

/* ---------- p5 plumbing ---------- */
const graph = new Graph();

function setup() {
  graph.setup();

  document.getElementById("btnSave").addEventListener("click", () => {
    graph.ensureAudio();
    graph.saveToFile();
  });

  document.getElementById("btnLoad").addEventListener("click", () => {
    graph.ensureAudio();
    graph.requestLoadFromFile();
  });

  document.getElementById("btnReset").addEventListener("click", () => {
    graph.ensureAudio();
    if (confirm("Reset graph (delete all nodes/edges)?")) graph.clearAll();
  });

  document.getElementById("btnClear").addEventListener("click", () => {
    graph.ensureAudio();
    graph.clearSignals();
  });

  document.getElementById("btnGenerate").addEventListener("click", () => {
    graph.ensureAudio();
    try {
      const generated = window.GraphGenerator.generateGraph(readGeneratorConfig());
      graph.deserialize(generated);
      genInfo.textContent = `${generated.nodes.length} nodes, ${generated.edges.length} edges`;
    } catch (e) {
      genInfo.textContent = "generation failed";
      alert("Failed to generate graph: " + (e && e.message ? e.message : String(e)));
    }
  });

  // Panel edits apply to hovered node only (never overwrite panel values on hover)
  const applyPanelToHoveredNode = () => {
    const hid = graph.hoveredNodeId;
    if (!hid) return;
    const n = graph.nodes.get(hid);
    if (!n) return;

    const cfg = readPanelConfig();
    n.threshold = cfg.threshold;
    n.frequency = cfg.frequency;
  };

  inpThreshold.addEventListener("input", applyPanelToHoveredNode);
  inpFreq.addEventListener("input", applyPanelToHoveredNode);

  // Delete hovered node
  document.addEventListener("keydown", (e) => {
    if (isEditingInput()) return;

    const key = (e.key || "").toLowerCase();
    if (key !== "delete" && key !== "backspace") return;

    const hid = graph.hoveredNodeId;
    if (!hid) return;

    e.preventDefault();
    graph.deleteNode(hid);
  });
}

function draw() {
  graph.draw();
  hoverInfo.textContent = graph.hoveredNodeId ? `node#${graph.hoveredNodeId}` : "none";
}

function windowResized() { graph.resize(); }

// Ignore clicks not on canvas (panel)
function mousePressed(event) {
  if (!event || !graph.canvas || event.target !== graph.canvas.elt) return;
  graph.mousePressed(mouseX, mouseY);
}
function mouseDragged(event) {
  if (!event || !graph.canvas || event.target !== graph.canvas.elt) return;
  graph.mouseDragged(mouseX, mouseY);
}
function mouseReleased(event) {
  if (!event || !graph.canvas || event.target !== graph.canvas.elt) return;
  graph.mouseReleased(mouseX, mouseY);
}
</script>
</body>
</html>
